run:
  name: template-oci-full-stack
  redaction: strict
  offline_only: false
  parallelism: 8

oci:
  enabled: true
  auth: instance_principal
  tenancy_ocid: "[REPLACE_TENANCY_OCID]"
  regions: [sa-santiago-1]
  compartments: all
  services: all

onprem_db:
  enabled: false

onprem_middleware:
  enabled: false
