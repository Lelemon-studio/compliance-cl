run:
  name: onprem-database-direct-sql-only
  redaction: strict
  offline_only: true
  parallelism: 4

oci:
  enabled: false
  regions: []
  compartments: all
  services: all

onprem_db:
  enabled: true
  dbsat:
    binary: /replace/with/dbsat/bin/dbsat
    targets: []
    report_formats: [json]
    exclude_sections: []
  direct_sql:
    enabled: true
    role: readonly_monitor
    targets:
      - alias: replace-database-alias
        dsn: "replace-db-host:1521/replace-service"
        username: replace_catalog_reader
        wallet_location: /replace/with/read-only-wallet-directory

onprem_middleware:
  enabled: false
  targets: []
