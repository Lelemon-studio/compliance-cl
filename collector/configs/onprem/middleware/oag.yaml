run:
  name: onprem-middleware-oag
  redaction: strict
  offline_only: true
  parallelism: 4

oci:
  enabled: false
  regions: []
  compartments: all
  services: all

onprem_db:
  enabled: false

onprem_middleware:
  enabled: true
  targets:
    - type: oag
      name: replace-oag-deployment
      config_path: /replace/with/exported-config/oag.json
      read_config_only: true
