run:
  name: onprem-middleware-oam
  redaction: strict
  offline_only: true
  parallelism: 4

oci:
  enabled: false
  regions: []
  compartments: all
  services: all

onprem_db:
  enabled: false

onprem_middleware:
  enabled: true
  targets:
    - type: oam
      name: replace-oam-deployment
      config_path: /replace/with/exported-config/oam.json
      read_config_only: true
