run:
  name: onprem-middleware-ohs
  redaction: strict
  offline_only: true
  parallelism: 4

oci:
  enabled: false
  regions: []
  compartments: all
  services: all

onprem_db:
  enabled: false

onprem_middleware:
  enabled: true
  targets:
    - type: ohs
      name: replace-ohs-instance
      config_path: /replace/with/exported-config/ohs.json
      read_config_only: true
